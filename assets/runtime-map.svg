<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Minimal runtime map</title>
  <desc id="desc">A simple architecture diagram of the repo's minimal runtime showing CLI, config, agent, tools, replay, and store.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #312e81; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .card-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)" />
  <text x="60" y="76" class="title">Minimal Runtime Map</text>
  <text x="60" y="106" class="subtitle">The runtime keeps only the harness responsibilities: orchestration, persistence, replay, and verification.</text>

  <rect x="80" y="170" width="200" height="110" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="110" y="212" class="card-title">CLI</text>
  <text x="110" y="240" class="card-text">`runtime/src/main.ts`</text>
  <text x="110" y="264" class="card-text">entrypoint and task setup</text>

  <rect x="350" y="170" width="220" height="110" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="212" class="card-title">Config</text>
  <text x="380" y="240" class="card-text">`runtime/src/config.ts`</text>
  <text x="380" y="264" class="card-text">provider and runtime options</text>

  <rect x="640" y="170" width="220" height="110" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="670" y="212" class="card-title">Live Agent</text>
  <text x="670" y="240" class="card-text">`runtime/src/pi-agent.ts`</text>
  <text x="670" y="264" class="card-text">model loop and tool calling</text>

  <rect x="930" y="170" width="190" height="110" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="960" y="212" class="card-title">Replay</text>
  <text x="960" y="240" class="card-text">`runtime/src/replay.ts`</text>
  <text x="960" y="264" class="card-text">session playback</text>

  <rect x="230" y="420" width="230" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="260" y="462" class="card-title">Tools</text>
  <text x="260" y="490" class="card-text">`runtime/src/tools.ts`</text>
  <text x="260" y="514" class="card-text">read, bash, edit, write</text>

  <rect x="510" y="420" width="230" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="540" y="462" class="card-title">Store</text>
  <text x="540" y="490" class="card-text">`runtime/src/store.ts`</text>
  <text x="540" y="514" class="card-text">JSONL event persistence</text>

  <rect x="790" y="420" width="230" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="820" y="462" class="card-title">Types</text>
  <text x="820" y="490" class="card-text">`runtime/src/types.ts`</text>
  <text x="820" y="514" class="card-text">shared runtime contracts</text>

  <path d="M280 225 H350" stroke="#2563eb" stroke-width="4"/>
  <path d="M570 225 H640" stroke="#2563eb" stroke-width="4"/>
  <path d="M860 225 H930" stroke="#2563eb" stroke-width="4"/>
  <path d="M750 280 V340 H345 V420" fill="none" stroke="#0f766e" stroke-width="4"/>
  <path d="M750 280 V340 H625 V420" fill="none" stroke="#0f766e" stroke-width="4"/>
  <path d="M1025 280 V420" fill="none" stroke="#0f766e" stroke-width="4"/>

  <rect x="80" y="590" width="1040" height="70" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="110" y="633" class="card-text">Design principle: the runtime is intentionally thin. Tool execution comes from the coding agent package; the repo’s own logic focuses on orchestration, verification, replay, and persistence.</text>
</svg>
