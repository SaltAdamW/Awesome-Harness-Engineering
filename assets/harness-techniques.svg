<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Harness design techniques</title>
  <desc id="desc">Eight cards summarizing common harness design techniques.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .card-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)" />
  <text x="60" y="74" class="title">Common Harness Design Techniques</text>
  <text x="60" y="104" class="subtitle">Most stability gains come from these engineering moves rather than from prompt tuning alone.</text>

  <g transform="translate(60 150)">
    <g transform="translate(0 0)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Small Actions</text>
      <text x="24" y="72" class="card-text">Expose only a few high-value tools.</text>
      <text x="24" y="96" class="card-text">Smaller action spaces are easier</text>
      <text x="24" y="118" class="card-text">to verify and stabilize.</text>
    </g>
    <g transform="translate(275 0)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">External Verifier</text>
      <text x="24" y="72" class="card-text">Use tests, assertions, scripts,</text>
      <text x="24" y="96" class="card-text">health checks, and page-state</text>
      <text x="24" y="118" class="card-text">checks to decide completion.</text>
    </g>
    <g transform="translate(550 0)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Intermediate Signals</text>
      <text x="24" y="72" class="card-text">Do not rely only on final success.</text>
      <text x="24" y="96" class="card-text">Surface progress and partial</text>
      <text x="24" y="118" class="card-text">wins while the task unfolds.</text>
    </g>
    <g transform="translate(825 0)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Durable Memory</text>
      <text x="24" y="72" class="card-text">Write progress to files, artifacts,</text>
      <text x="24" y="96" class="card-text">logs, or checkpoints instead</text>
      <text x="24" y="118" class="card-text">of keeping it in prompt only.</text>
    </g>

    <g transform="translate(0 190)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Default Recovery</text>
      <text x="24" y="72" class="card-text">Plan retries, rollbacks, timeouts,</text>
      <text x="24" y="96" class="card-text">step budgets, and resumes from</text>
      <text x="24" y="118" class="card-text">the start of the design.</text>
    </g>
    <g transform="translate(275 190)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Replayable Logs</text>
      <text x="24" y="72" class="card-text">Capture events and state changes</text>
      <text x="24" y="96" class="card-text">so failures can be diagnosed</text>
      <text x="24" y="118" class="card-text">instead of guessed at.</text>
    </g>
    <g transform="translate(550 190)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Risk Tiers</text>
      <text x="24" y="72" class="card-text">Low-risk reads can be automatic.</text>
      <text x="24" y="96" class="card-text">Destructive writes and sensitive</text>
      <text x="24" y="118" class="card-text">actions should require approval.</text>
    </g>
    <g transform="translate(825 190)">
      <rect width="245" height="140" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="42" class="card-title">Continuous Evals</text>
      <text x="24" y="72" class="card-text">Run regression suites whenever</text>
      <text x="24" y="96" class="card-text">you change tools, prompts,</text>
      <text x="24" y="118" class="card-text">verifiers, or context logic.</text>
    </g>
  </g>

  <rect x="60" y="705" width="1080" height="85" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="742" style="font:700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#0f172a;">Heuristic</text>
  <text x="90" y="770" class="card-text">When an agent feels unstable, first ask which of these boxes is missing. The answer is usually more actionable than “use a better model.”</text>
</svg>
