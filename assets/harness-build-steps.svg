<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Build a harness from scratch</title>
  <desc id="desc">A staircase diagram showing seven steps for building a simple harness from scratch.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#ecfccb" />
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14532d; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .step { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .body { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)" />
  <text x="60" y="74" class="title">Build a Harness From Scratch</text>
  <text x="60" y="104" class="subtitle">A practical order that keeps the design grounded in verification instead of prompt improvisation.</text>

  <g transform="translate(80 170)">
    <rect x="0" y="390" width="150" height="110" rx="22" fill="#2563eb" />
    <text x="75" y="438" text-anchor="middle" class="step">1. Success</text>
    <text x="20" y="468" class="body" fill="#ffffff">Define what “done”</text>
    <text x="20" y="489" class="body" fill="#ffffff">means externally.</text>

    <rect x="150" y="325" width="150" height="175" rx="22" fill="#1d4ed8" />
    <text x="225" y="373" text-anchor="middle" class="step">2. Actions</text>
    <text x="170" y="403" class="body" fill="#ffffff">Keep the tool set</text>
    <text x="170" y="424" class="body" fill="#ffffff">small and explicit.</text>

    <rect x="300" y="260" width="150" height="240" rx="22" fill="#0284c7" />
    <text x="375" y="308" text-anchor="middle" class="step">3. Feedback</text>
    <text x="320" y="338" class="body" fill="#ffffff">Return structured,</text>
    <text x="320" y="359" class="body" fill="#ffffff">high-signal results.</text>

    <rect x="450" y="195" width="150" height="305" rx="22" fill="#0f766e" />
    <text x="525" y="243" text-anchor="middle" class="step">4. Verifier</text>
    <text x="470" y="273" class="body" fill="#ffffff">Add tests, scripts,</text>
    <text x="470" y="294" class="body" fill="#ffffff">or assertions.</text>

    <rect x="600" y="130" width="150" height="370" rx="22" fill="#059669" />
    <text x="675" y="178" text-anchor="middle" class="step">5. Memory</text>
    <text x="620" y="208" class="body" fill="#ffffff">Persist logs, progress,</text>
    <text x="620" y="229" class="body" fill="#ffffff">artifacts, checkpoints.</text>

    <rect x="750" y="65" width="150" height="435" rx="22" fill="#ca8a04" />
    <text x="825" y="113" text-anchor="middle" class="step">6. Guardrails</text>
    <text x="770" y="143" class="body" fill="#ffffff">Time limits, write</text>
    <text x="770" y="164" class="body" fill="#ffffff">boundaries, approvals.</text>

    <rect x="900" y="0" width="150" height="500" rx="22" fill="#9333ea" />
    <text x="975" y="48" text-anchor="middle" class="step">7. Prompt + Skill</text>
    <text x="920" y="78" class="body" fill="#ffffff">Only now optimize</text>
    <text x="920" y="99" class="body" fill="#ffffff">the prompt layer.</text>
  </g>
</svg>
