<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Harness family comparison</title>
  <desc id="desc">A visual comparison of PC-based, code-based, and sandbox-based harness families.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#fef2f2" />
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .head { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .cell { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)" />
  <text x="60" y="72" class="title">Three Harness Families</text>
  <text x="60" y="102" class="subtitle">The main difference is not the model. It is the environment center, feedback style, and risk profile.</text>

  <g transform="translate(60 150)">
    <rect width="1080" height="520" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="250" y1="0" x2="250" y2="520" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="527" y1="0" x2="527" y2="520" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="804" y1="0" x2="804" y2="520" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="85" x2="1080" y2="85" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="185" x2="1080" y2="185" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="0" y1="285" x2="1080" y2="285" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="0" y1="385" x2="1080" y2="385" stroke="#e2e8f0" stroke-width="2"/>

    <text x="40" y="52" class="head">Dimension</text>
    <text x="310" y="52" class="head">PC-based</text>
    <text x="587" y="52" class="head">Code-based</text>
    <text x="864" y="52" class="head">Sandbox-based</text>

    <text x="40" y="128" class="label">Main environment</text>
    <text x="310" y="128" class="cell">browser, desktop, OS</text>
    <text x="587" y="128" class="cell">repo, shell, CI, git</text>
    <text x="864" y="128" class="cell">VM, container, workspace</text>

    <text x="40" y="228" class="label">Typical actions</text>
    <text x="310" y="215" class="cell">click, type, scroll,</text>
    <text x="310" y="238" class="cell">snapshot, screenshot</text>
    <text x="587" y="215" class="cell">read, edit, write,</text>
    <text x="587" y="238" class="cell">bash, test, diff</text>
    <text x="864" y="215" class="cell">run, browse, install,</text>
    <text x="864" y="238" class="cell">script, export, serve</text>

    <text x="40" y="328" class="label">Best verifier</text>
    <text x="310" y="315" class="cell">UI tree, page state,</text>
    <text x="310" y="338" class="cell">task artifact</text>
    <text x="587" y="315" class="cell">tests, lint, build,</text>
    <text x="587" y="338" class="cell">diff, CI</text>
    <text x="864" y="315" class="cell">service checks, artifact</text>
    <text x="864" y="338" class="cell">validation, staged scripts</text>

    <text x="40" y="428" class="label">Main challenge</text>
    <text x="310" y="415" class="cell">noisy observations,</text>
    <text x="310" y="438" class="cell">real-world risk</text>
    <text x="587" y="415" class="cell">large context and</text>
    <text x="587" y="438" class="cell">multi-step drift</text>
    <text x="864" y="415" class="cell">systems complexity,</text>
    <text x="864" y="438" class="cell">permissions, recovery</text>

    <text x="40" y="490" class="label">Recommended first use</text>
    <text x="310" y="490" class="cell">computer use, browser tasks</text>
    <text x="587" y="490" class="cell">first harness, coding agents</text>
    <text x="864" y="490" class="cell">complex workflows, research</text>
  </g>
</svg>
