<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Harness components</title>
  <desc id="desc">A diagram showing the core components of an agent harness around a central execution loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0.1em; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)" />
  <text x="70" y="78" class="title">Harness Components</text>
  <text x="70" y="108" class="subtitle">A model becomes an executable agent only when these parts are wired into one controlled loop.</text>

  <circle cx="600" cy="390" r="145" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
  <text x="600" y="372" text-anchor="middle" class="small">CORE LOOP</text>
  <text x="600" y="410" text-anchor="middle" class="label">Observe</text>
  <text x="600" y="442" text-anchor="middle" class="body">Act • Feedback • Verify</text>

  <rect x="115" y="165" width="260" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="145" y="205" class="label">Task</text>
  <text x="145" y="238" class="body">What the agent is trying to achieve.</text>
  <text x="145" y="263" class="body">Example: fix a bug, export a report,</text>
  <text x="145" y="286" class="body">navigate a webpage, complete a workflow.</text>

  <rect x="825" y="165" width="260" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="855" y="205" class="label">Environment</text>
  <text x="855" y="238" class="body">Where execution happens.</text>
  <text x="855" y="263" class="body">Repo, browser, desktop, container,</text>
  <text x="855" y="286" class="body">VM, app server, external APIs.</text>

  <rect x="75" y="480" width="260" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="105" y="520" class="label">Tools</text>
  <text x="105" y="553" class="body">The allowed actions.</text>
  <text x="105" y="578" class="body">read, edit, bash, click, snapshot,</text>
  <text x="105" y="601" class="body">install, export, submit, retry.</text>

  <rect x="865" y="480" width="260" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="895" y="520" class="label">Verifier</text>
  <text x="895" y="553" class="body">The external acceptance logic.</text>
  <text x="895" y="578" class="body">Tests, scripts, assertions, service</text>
  <text x="895" y="601" class="body">health checks, page-state checks.</text>

  <rect x="420" y="125" width="360" height="95" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="450" y="165" class="label">Feedback</text>
  <text x="450" y="198" class="body">The real world answers back with exit codes, diffs, screenshots, logs, and state changes.</text>

  <rect x="420" y="565" width="360" height="105" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="450" y="605" class="label">Memory + Guardrails</text>
  <text x="450" y="638" class="body">Progress files, checkpoints, logs, permissions, approvals, and risk controls keep the loop stable.</text>

  <path d="M375 225 C450 250 485 285 510 310" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M825 225 C750 250 715 285 690 310" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M335 540 C420 525 475 495 500 470" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <path d="M865 540 C780 525 725 495 700 470" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 220 L600 245" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 535 L600 565" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
</svg>
