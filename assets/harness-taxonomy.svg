<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Harness engineering overview</title>
  <desc id="desc">A simplified overview graphic highlighting three harness examples: OpenClaw, Codex, and Manus.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .center-title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .center-text { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; }
      .card-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .card-type { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2563eb; letter-spacing: 0.12em; }
      .card-text { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="url(#bg)" />

  <text x="80" y="88" class="title">Harness Engineering</text>
  <text x="80" y="120" class="subtitle">The core question is not just model capability. It is what environment, feedback, and verifier the agent runs inside.</text>

  <rect x="380" y="200" width="440" height="170" rx="32" fill="url(#center)" />
  <text x="600" y="270" text-anchor="middle" class="center-title">Harness = execution loop</text>
  <text x="600" y="308" text-anchor="middle" class="center-text">environment • tools • feedback • verifier • memory</text>

  <path d="M380 285 C315 285 275 285 240 285" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M820 285 C885 285 925 285 960 285" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M600 370 C600 420 600 450 600 485" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <rect x="70" y="210" width="260" height="150" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="100" y="252" class="card-type">PC-BASED</text>
  <text x="100" y="294" class="card-title">OpenClaw</text>
  <text x="100" y="327" class="card-text">A computer-use harness centered on</text>
  <text x="100" y="352" class="card-text">browser, desktop, and real GUI actions.</text>

  <rect x="870" y="210" width="260" height="150" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="900" y="252" class="card-type">CODE-BASED</text>
  <text x="900" y="294" class="card-title">Codex</text>
  <text x="900" y="327" class="card-text">A coding harness centered on repo,</text>
  <text x="900" y="352" class="card-text">shell, tests, diffs, and CI feedback.</text>

  <rect x="380" y="500" width="440" height="150" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="410" y="542" class="card-type">SANDBOX-BASED</text>
  <text x="410" y="584" class="card-title">Manus</text>
  <text x="410" y="617" class="card-text">A sandbox harness centered on isolated workspaces, tools,</text>
  <text x="410" y="642" class="card-text">persistent filesystems, and multi-step task execution.</text>
</svg>
