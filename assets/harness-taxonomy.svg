<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Harness engineering hero graphic</title>
  <desc id="desc">A clean overview graphic highlighting three harness examples: OpenClaw, Codex, and Manus.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f1e8" />
      <stop offset="52%" stop-color="#fbfcf8" />
      <stop offset="100%" stop-color="#e7eef7" />
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17324d" />
      <stop offset="100%" stop-color="#285c7a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px Georgia, "Times New Roman", serif; fill: #172033; }
      .subtitle { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #445066; }
      .hero-title { font: 700 32px Georgia, "Times New Roman", serif; fill: #f8fafc; }
      .hero-text { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d9e7f2; }
      .badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.16em; }
      .card-title { font: 700 30px Georgia, "Times New Roman", serif; fill: #172033; }
      .card-text { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" />

  <text x="86" y="92" class="title">Awesome Harness Engineering</text>
  <text x="86" y="127" class="subtitle">Three useful reference shapes for thinking about environments, feedback, and verifiers.</text>

  <rect x="86" y="168" width="1028" height="178" rx="34" fill="url(#hero)" filter="url(#shadow)" />
  <text x="600" y="234" text-anchor="middle" class="hero-title">Harness Engineering is about the loop,</text>
  <text x="600" y="272" text-anchor="middle" class="hero-title">not just the model.</text>
  <text x="600" y="324" text-anchor="middle" class="hero-text">A good harness defines where the agent acts, what it can do, how the environment answers back, and how success gets verified.</text>

  <rect x="86" y="406" width="314" height="224" rx="30" fill="#fffdf8" stroke="#d8dee8" stroke-width="2" filter="url(#shadow)" />
  <rect x="110" y="432" width="102" height="28" rx="14" fill="#e0ecff" />
  <text x="161" y="451" text-anchor="middle" class="badge" fill="#2f5d91">PC-BASED</text>
  <text x="110" y="510" class="card-title">OpenClaw</text>
  <text x="110" y="548" class="card-text">Computer-use harness for browser,</text>
  <text x="110" y="575" class="card-text">desktop, and real GUI interaction.</text>

  <rect x="443" y="406" width="314" height="224" rx="30" fill="#fffdf8" stroke="#d8dee8" stroke-width="2" filter="url(#shadow)" />
  <rect x="467" y="432" width="118" height="28" rx="14" fill="#e5f4ec" />
  <text x="526" y="451" text-anchor="middle" class="badge" fill="#2d6a4f">CODE-BASED</text>
  <text x="467" y="510" class="card-title">Codex</text>
  <text x="467" y="548" class="card-text">Coding harness for repositories, shell,</text>
  <text x="467" y="575" class="card-text">tests, diffs, and CI-driven feedback.</text>

  <rect x="800" y="406" width="314" height="224" rx="30" fill="#fffdf8" stroke="#d8dee8" stroke-width="2" filter="url(#shadow)" />
  <rect x="824" y="432" width="142" height="28" rx="14" fill="#f4e8ff" />
  <text x="895" y="451" text-anchor="middle" class="badge" fill="#7752a3">SANDBOX-BASED</text>
  <text x="824" y="510" class="card-title">Manus</text>
  <text x="824" y="548" class="card-text">Sandbox harness for isolated workspaces,</text>
  <text x="824" y="575" class="card-text">persistent filesystems, and long tasks.</text>
</svg>
