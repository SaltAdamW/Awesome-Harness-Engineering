name: hourly-source-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh official source snapshots
        run: node scripts/sync-official-sources.mjs

      - name: Commit snapshot changes
        run: |
          if git diff --quiet -- research/source-snapshots.json; then
            echo "No upstream source changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/source-snapshots.json
          git commit -m "chore: refresh official source snapshots"
          git push
